name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `packageManager` in package.json pins the pnpm version.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Vite+: format, lint and type checks in one pass.
      - run: pnpm run check

      - run: pnpm test

      - run: pnpm run build
        env:
          # The build only needs the variable to exist; nothing is called.
          VITE_CONVEX_URL: https://example.convex.cloud
